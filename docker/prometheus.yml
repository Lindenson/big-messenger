# Prometheus scrape config for HormigaMessanger.
# The app exports Micrometer metrics (all under the `messenger_*` namespace) at /q/metrics.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: messenger
    metrics_path: /q/metrics
    static_configs:
      - targets: ['messenger:8080']   # compose service name; use host:port for an external app
        labels:
          service: hormiga-messenger

  # Prometheus scraping itself (handy for debugging the scrape).
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
