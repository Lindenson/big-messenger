name: deploy

# CI/CD for the Hormiga Messenger service. Builds the Quarkus fast-jar, ships it to the
# server and restarts the container via ./deploy.sh (targets the hormiga-deploy checkout).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SSH_PRIVATE_KEY  private key authorized on the deploy host
#   DEPLOY_HOST      ssh target, e.g. den@preprod.example.com
#   DEPLOY_PATH      hormiga-deploy checkout path on the server (e.g. /opt/hormigas_run/hormiga-deploy)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp -DskipITs verify

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Manual promotion: run from the Actions tab after tests pass.
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: https://hormi.isolutions.io/messenger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Deploy via deploy.sh
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${DEPLOY_HOST##*@}" >> ~/.ssh/known_hosts 2>/dev/null
          REMOTE_DOCKER="sudo docker" SSH_OPTS="-i $HOME/.ssh/id_deploy -o BatchMode=yes" ./deploy.sh
